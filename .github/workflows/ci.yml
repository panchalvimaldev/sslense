name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build SSLense.sln -c Release -nologo

      # Unit tests use mocks and local resources only; nothing contacts Let's Encrypt.
      - name: Test
        run: dotnet test SSLense.sln -c Release --no-build -nologo
